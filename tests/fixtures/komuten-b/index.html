    <h1>木の家工務店B - 自然素材で建てる注文住宅</h1>
    <p>北九州市八幡西区の工務店です。漆喰、無垢材、自然塗料といった本物の自然素材だけを使い、家族の健康と環境に配慮した家づくりを行っています。</p>
    <p>創業20年、これまでに2,000棟以上の自然素材住宅を建ててきました。</p>
